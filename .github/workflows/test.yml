name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:js
      # Builds the Worker and validates wrangler.jsonc without deploying (no Cloudflare account needed).
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
        env:
          WRANGLER_SEND_METRICS: "false"
